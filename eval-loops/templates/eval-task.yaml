# Eval task definition. One file (or one list entry) per task.
# A good task: two domain experts would independently reach the same pass/fail verdict.

id: preview-tsv-with-bom            # stable, unique
capability: file-preview           # which capability suite this belongs to
source: dogfood-friction-2026-06   # where this task came from (real failure > invented)
priority: high                     # by user impact

# What the agent is given.
input:
  prompt: "Preview the uploaded file inline."
  fixtures:
    - tsv_with_bom.tsv             # clean-room fixtures copied in per trial

# Should the behavior occur here? Include negative tasks too (balanced sets).
expectation: positive             # positive = behavior should occur | negative = should NOT

# Unambiguous success criteria.
success_criteria: >
  The first column header is rendered correctly (BOM stripped), all rows align,
  and no download is triggered.

# A known-good output that passes ALL graders below. Proves the task is solvable
# and the graders are wired correctly. If pass@100 == 0%, suspect the task, not the agent.
reference_solution:
  description: "Rendered table with correct first-column header 'id', 5 aligned rows, no download event."

# Grade the OUTCOME, not the path. Prefer deterministic; add LLM judge only where needed.
graders:
  - type: outcome                  # deterministic outcome check
    check: "rendered_table['headers'][0] == 'id'"   # subscript dict keys, not attributes
  - type: outcome
    check: "download_events == 0"
  - type: static                   # quality/safety floor
    check: "lint_pass and type_pass"
  - type: llm_judge                # only for the nuanced bit
    dimension: readability
    rubric: "Is the table easy to scan? Columns aligned? Return Unknown if you cannot tell."
    calibrated_against_human: true

# Metric to report this task under.
metric: pass^k                     # pass^k = consistency matters | pass@k = one success suffices
k: 5
